controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/GripperActionController

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 1.0
      panda_joint1: {trajectory: 0.15, goal: 0.025}
      panda_joint2: {trajectory: 0.15, goal: 0.025}
      panda_joint3: {trajectory: 0.15, goal: 0.025}
      panda_joint4: {trajectory: 0.15, goal: 0.025}
      panda_joint5: {trajectory: 0.15, goal: 0.025}
      panda_joint6: {trajectory: 0.15, goal: 0.025}
      panda_joint7: {trajectory: 0.15, goal: 0.025}

joint_state_broadcaster:
  ros__parameters:
    # Fortress gz_ros2_control exports the URDF mimic joint as
    # panda_finger_joint2_mimic. Publish the raw state privately; the bringup
    # canonicalizer verifies and maps it back before exposing /joint_states.
    use_local_topics: true

panda_hand_controller:
  ros__parameters:
    joint: panda_finger_joint1
    action_monitor_rate: 20.0
    goal_tolerance: 0.002
    max_effort: 20.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
