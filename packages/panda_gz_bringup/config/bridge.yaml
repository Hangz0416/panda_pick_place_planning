# Topic bridges only. ControlWorld and SetEntityPose are service bridges and
# are launched explicitly because the Humble / Fortress YAML parser only
# supports topic entries across all supported ros_gz patch versions.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK

