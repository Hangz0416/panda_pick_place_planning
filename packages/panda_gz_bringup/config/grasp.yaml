assisted_grasp_manager:
  ros__parameters:
    world_frame: world
    hand_frame: panda_grasptarget
    finger_joints: [panda_finger_joint1, panda_finger_joint2]
    # The FSM targets panda_hand at z=75 mm while the 50 mm cube centre is at
    # z=25 mm, so the expected world-frame hand-minus-object offset is 50 mm.
    expected_hand_offset_xyz: [0.0, 0.0, 0.050]
    expected_hand_quaternion_xyzw: [0.9238795, -0.3826834, 0.0, 0.0]
    max_position_error_m: 0.020
    max_orientation_error_rad: 0.30
    max_hand_object_distance_m: 0.090
    # Per-finger command used before assisted attach. The hand is yawed 45 deg,
    # so a 50 mm cube presents a 70.7 mm in-plane diagonal. Two 38 mm commands
    # leave guarded clearance; the gate still checks measured joint positions.
    assisted_pre_attach_width_m: 0.038
    per_finger_width_tolerance_m: 0.004
    command_timeout_sec: 2.0

physical_grasp_monitor:
  ros__parameters:
    # Keep false until the shared Gazebo model contains audited Franka inertial
    # parameters and a physics-grasp runtime validation has been recorded.
    physics_model_validated: false
    world_frame: world
    hand_frame: panda_grasptarget
    left_finger_collision_token: panda_leftfinger
    right_finger_collision_token: panda_rightfinger
    contact_freshness_sec: 0.10
    bilateral_contact_confirm_sec: 0.10
    release_confirm_sec: 0.10
    max_relative_translation_drift_m: 0.015
    max_relative_rotation_drift_rad: 0.20
    stable_linear_speed_mps: 0.05
    update_rate_hz: 50.0

execution_collision_monitor:
  ros__parameters:
    grasp_mode: assisted
    contact_stream_timeout_sec: 1.0
    target_xy_tolerance_m: 0.040
    target_z_tolerance_m: 0.015

episode_reset_manager:
  ros__parameters:
    world_name: panda_pick_place
    grasp_mode: assisted
    home_joints: [0.0, -0.65, 0.0, -2.2, 0.0, 1.55, 0.78]
    home_duration_sec: 3.0
    home_timeout_sec: 8.0
    service_timeout_sec: 10.0
    joint_position_tolerance_rad: 0.025
    joint_velocity_tolerance_rad_s: 0.025
    gripper_position_tolerance_m: 0.003
    joint_state_timeout_sec: 3.0
    home_stable_sec: 0.20
    open_gripper_width_m: 0.040
    gripper_max_effort: 20.0
    entity_state_timeout_sec: 5.0
    entity_state_stable_sec: 0.20
    entity_position_tolerance_m: 0.005
    entity_orientation_tolerance_rad: 0.05
    cube_linear_velocity_tolerance_mps: 0.010
    cube_angular_velocity_tolerance_rad_s: 0.050
    auto_reset: true
    auto_reset_delay_sec: 8.0
    target_marker_z: 0.001
    obstacle_pose: [0.54, 0.0, 0.14, 0.0, 0.0, 0.0, 1.0]
    clear_obstacle_pose: [0.54, 2.0, 0.14, 0.0, 0.0, 0.0, 1.0]
