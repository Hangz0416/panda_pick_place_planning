<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="450" viewBox="0 0 1500 450" role="img" aria-labelledby="chart-title">
<title id="chart-title">Panda V2 PyBullet 200-episode benchmark — Full episode failure counts</title>
<style>
